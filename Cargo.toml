[package]
name = "rakuos-shell-picker"
version = "1.1.2"
authors = ["RakuOS"]
license = "GPL-3.0-only"
edition = "2021"

# Split lib/bin so the registry and session state can be unit tested without a
# display server.
[lib]
name = "rakuos_shell_picker"
path = "src/lib.rs"

[[bin]]
name = "rakuos-shell-picker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
gtk4 = { version = "0.9", features = ["v4_8"] }
libadwaita = { version = "0.7", features = ["v1_6"] }

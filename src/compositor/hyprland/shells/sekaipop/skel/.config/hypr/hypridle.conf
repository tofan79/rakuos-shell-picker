# Idle handling. The lock itself is the shell's lockscreen (ipc call lock lock); hyprlock is
# only a fallback if the shell is not running (optional: leave it uninstalled and the fallback
# just does nothing).
$lock_cmd = qs -c sekaipop ipc call lock lock || pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    # Hyprland sometimes drops keyboard focus from the lock surface after a wake.
    after_sleep_cmd = qs -c sekaipop ipc call lock focus
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}

[Appearance]
# DMS's matugen config (matugen/configs/qt6ct.toml) writes the palette into
# qt6ct/colors/matugen.conf and never touches this file, so [Appearance] has no
# other owner -- deleting it would hand Qt apps the qt6ct built-in defaults
# instead. It lives in the skel because a switch from another shell replaces
# this file: without it, color_scheme_path keeps pointing at the palette the
# shell that just left wrote, while matugen.conf sits unused beside it.
color_scheme_path = /home/$USER/.config/qt6ct/colors/matugen.conf
custom_palette = true
# Icon theme is pinned in three places, all in this skel:
#   gtk-3.0/settings.ini -> gtk-icon-theme-name   (GTK3 apps)
#   gtk-4.0/settings.ini -> gtk-icon-theme-name   (GTK4 apps)
#   qt6ct/qt6ct.conf     -> icon_theme            (Qt apps)
# All must agree. Change one, change all three.
icon_theme = Colloid-Dark
standard_dialogs = gtk3
style = Fusion
